<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JRRQMWL5VS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JRRQMWL5VS');
    </script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RipScan | Lector</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep: #050505;
            --bg-surface: #121212;
            --accent-primary: #a855f7;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            line-height: 1.6;
        }

        header { 
            padding: 20px 6%; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(20px); 
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; 
            position: sticky; top: 0; z-index: 1000; 
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out; 
        }

        .menu-btn { display: none; cursor: pointer; font-size: 1.2rem; }
        .logo-container { cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .logo-text { font-weight: 800; font-size: 1.5rem; color: var(--accent-primary); letter-spacing: 1px; }

        .nav-menu { display: flex; gap: 30px; }
        .nav-menu a { color: var(--text-main); text-decoration: none; font-weight: 600; }
        .nav-menu a:hover { color: var(--accent-primary); }

        #search { background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px 20px; border-radius: 25px; width: 250px; }

        .mobile-menu { 
            display: none; position: absolute; top: 75px; left: 0; width: 100%; 
            background: var(--bg-surface); padding: 20px; border-bottom: 1px solid #333; z-index: 999;
            flex-direction: column; gap: 15px; text-align: center;
        }
        .mobile-menu a { color: white; text-decoration: none; font-size: 1.1rem; font-weight: 600; }

        .reader-nav { 
            padding: 15px; display: flex; justify-content: center; gap: 15px; 
            background: #0d0d0d; border-bottom: 1px solid #222; 
            position: sticky; top: 75px; z-index: 900; 
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out; 
        }
        .btn { color: white; text-decoration: none; background: #1a1a1a; padding: 10px 20px; border-radius: 6px; font-weight: 600; border: 1px solid #333; transition: 0.3s; }
        .btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

        /* Contenedor simple para imágenes sin protección */
        .img-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .lector-img { width: 100%; display: block; }

        #comentarios-section {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: var(--bg-surface);
            border-radius: 8px;
            border: 1px solid #333;
        }

        @media (max-width: 600px) {
            header { padding: 15px 4%; }
            .menu-btn { display: block; }
            .nav-menu { display: none; }
            .logo-container { position: absolute; left: 50%; transform: translateX(-50%); }
            #search { width: 80px; padding: 6px 12px; font-size: 0.8rem; }
            .reader-nav { top: 60px; } 
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-btn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="logo-container" onclick="location.href='index.html'">
            <span class="logo-text">RIPSCAN</span>
        </div>
        <nav class="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="mis-manhwas.html">Mis Manhwas</a>
        </nav>
        <input type="text" id="search" placeholder="Buscar..." onkeyup="handleSearch(event)">
    </header>

    <div id="mobileMenu" class="mobile-menu">
        <a href="index.html">Inicio</a>
        <a href="mis-manhwas.html">Mis Manhwas</a>
    </div>

    <div class="reader-nav">
        <a id="btnPrev" class="btn">⬅ Ant</a>
        <a id="btnInfo" class="btn">Info</a>
        <a id="btnNext" class="btn">Sig ➡</a>
    </div>

    <div id="container" style="padding-top:20px;"></div>

    <div id="comentarios-section">
        <h3 style="color: var(--accent-primary); margin-bottom: 20px;">Comentarios del Capítulo</h3>
        <div id="intensedebate-container"></div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        let lastScrollTop = 0;
        const header = document.querySelector('header');
        const readerNav = document.querySelector('.reader-nav');

        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                header.style.transform = 'translateY(-100%)';
                readerNav.style.transform = 'translateY(-100%)';
                header.style.opacity = '0';
                readerNav.style.opacity = '0';
            } else {
                header.style.transform = 'translateY(0)';
                readerNav.style.transform = 'translateY(0)';
                header.style.opacity = '1';
                readerNav.style.opacity = '1';
            }
            lastScrollTop = scrollTop;
        });

        const p = new URLSearchParams(window.location.search);
        const id = p.get('manga'), cap = parseInt(p.get('cap'));
        
        document.getElementById('btnInfo').href = `info.html?manga=${id}`;
        
        if(cap > 1) {
            document.getElementById('btnPrev').href = `lector.html?manga=${id}&cap=${cap - 1}`;
        } else {
            document.getElementById('btnPrev').style.display = "none";
        }

        fetch('mangas.json').then(r => r.json()).then(data => {
            const mangaActual = data.find(m => m.id === id);
            const btnNext = document.getElementById('btnNext');
            if (mangaActual && cap < mangaActual.totalCaps) {
                btnNext.href = `lector.html?manga=${id}&cap=${cap + 1}`;
            } else {
                btnNext.style.opacity = "0.5";
                btnNext.style.pointerEvents = "none";
                btnNext.innerText = "Fin del Manhwa";
            }
        });

        const commentContainer = document.getElementById('intensedebate-container');
        window.idcomments_acct = '27b2e72b91699e3f8ac5d0d5f027dafc';
        window.idcomments_post_id = `ripscan-${id}-cap-${cap}`;
        window.idcomments_post_url = window.location.href;
        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://www.intensedebate.com/js/genericCommentWrapperV2.js';
        commentContainer.appendChild(script);

        // Lógica de carga de imágenes SIN protección
        function appendImage(src) {
            const div = document.createElement('div');
            div.className = 'img-container';
            const img = document.createElement('img');
            img.src = src;
            img.className = "lector-img";
            div.appendChild(img);
            document.getElementById('container').appendChild(div);
        }

        function loadSingleImage(filename, callback) {
            const path = `mangas/${id}/cap-${cap}/${filename}`;
            const imgCheck = new Image();
            imgCheck.src = path;
            imgCheck.onload = () => { 
                appendImage(path);
                if(callback) callback(); 
            };
            imgCheck.onerror = () => { if(callback) callback(); }; 
        }

        function loadNumberedPages(pageNumber) {
            const filename = `${String(pageNumber).padStart(3, '0')}_resultado.webp`;
            const path = `mangas/${id}/cap-${cap}/${filename}`;
            const imgCheck = new Image();
            imgCheck.src = path;
            imgCheck.onload = () => { 
                appendImage(path);
                loadNumberedPages(pageNumber + 1); 
            };
            imgCheck.onerror = () => { 
                loadSingleImage('999_creditos_resultado.webp');
            };
        }

        loadSingleImage('000_creditos_resultado.webp', () => {
            loadNumberedPages(1);
        });

        function handleSearch(e) { 
            if(e.key === 'Enter') window.location.href = `index.html?search=${e.target.value}`; 
        }
    </script>
</body>
</html>
